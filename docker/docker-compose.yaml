services:

  vector-db:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 35s
      timeout: 10s
      retries: 5
      start_period: 80s

  copilot-cli:
    image: copilot-cli:latest
    build:
      context: .
      dockerfile: ./copilot.Dockerfile
    restart: unless-stopped
    command: ["--headless", "--host", "0.0.0.0", "--port", "4321"]
    expose:
      - "4321"

  polragion-backend:
    image: polragion-backend:latest
    build:
      context: ../polragion-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
      - QDRANT_URL=http://vector-db:6333
      - COPILOT_URL=http://copilot-cli:4321
      - GITHUB_REDIRECT_URI=http://127.0.0.1:8000/auth/github/callback
      - SQLITE_FILE_PATH=/app/data/polragion.db
    volumes:
      - ./backend-data:/app/data:Z
    depends_on:
      vector-db:
        condition: service_healthy
      copilot-cli:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  polragion-frontend:
    image: polragion-frontend:latest
    build:
      context: ../polragion-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - ENV=production
    depends_on:
      polragion-backend:
        condition: service_healthy
